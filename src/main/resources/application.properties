spring.application.name=workmate-ai

spring.datasource.url=jdbc:postgresql://localhost:5433/workmate_ai
spring.datasource.username=postgres
spring.datasource.password=MyNewPassword@123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=V29ya01hdGVBSV9zdXBlcl9zZWNyZXRfa2V5XzMyX2J5dGVzX2xvbmc=
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=nomic-embed-text
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always